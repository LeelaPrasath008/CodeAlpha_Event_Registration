<!DOCTYPE html>
<html>
<head>
    <title>Events</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            margin:40px;
            background:#f4f6f9;
        }

        h1{
            text-align:center;
        }

        .event-card{
            background:white;
            padding:20px;
            margin:20px auto;
            width:600px;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        .event-card h2{
            color:#333;
        }

        .event-card p{
            margin:8px 0;
        }
    </style>

</head>

<body>

<a href="/events/my-registrations/">
    My Registrations
</a>

<hr>

<h1>Available Events</h1>

{% for event in events %}

<div class="event-card">

    <h2>
        <a href="/events/{{ event.id }}/">
            {{ event.title }}
        </a>
    </h2>

    <p>
        <strong>Description:</strong>
        {{ event.description }}
    </p>

    <p>
        <strong>Date:</strong>
        {{ event.date }}
    </p>

    <p>
        <strong>Location:</strong>
        {{ event.location }}
    </p>

    <p>
        <strong>Capacity:</strong>
        {{ event.capacity }}
    </p>

    <p>
        <strong>Organizer:</strong>
        {{ event.organizer }}
    </p>

</div>

{% empty %}

<h2>No Events Available</h2>

{% endfor %}

</body>
</html>
